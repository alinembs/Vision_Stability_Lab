# MediaMTX configuration for Vision Stability Lab
rtspAddress: :8554
rtmpAddress: :1935
hlsAddress: :8888
webrtcAddress: :8889

# Mídia ICE/UDP e ICE/TCP no mesmo port 8189 (publicado no compose como
# 8189/udp e 8189/tcp). Sem este bind o WHIP conclui a sinalização e o vídeo
# nunca chega — sintoma documentado no ADR-0005 do projeto arquo (T0.2).
webrtcLocalUDPAddress: :8189
webrtcLocalTCPAddress: :8189

# `no` evita anunciar `docker0`/`br-*` (172.x) como candidato: o navegador
# escolheria um caminho inalcançável e ficaria em tela preta (ADR-0005, T0.2).
webrtcIPsFromInterfaces: no
# Anuncia explicitamente o IP da LAN do Jetson. O endereço é o do host onde o
# stack roda (enxd0c857009d17); se a máquina mudar de rede, atualizar aqui.
webrtcAdditionalHosts: [192.168.59.102]

# RTSP por TCP: casa com `protocols=4` (tcp) usado pelo pipeline
# (deepstream/pipeline_real.py).
rtspTransports: [tcp]

api: no

paths:
  # Preview anotado publicado pelo pipeline.
  live:
  # Fonte 1 — drone (push RTMP → republicado em RTSP para o pipeline).
  drone:
  # Fonte 2 — celular (publish WHIP → republicado em RTSP para o pipeline).
  phone:
