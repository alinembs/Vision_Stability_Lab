# Servidor HTTPS da página de captura do celular (E0-T4).
#
# **Por que existe:** o TLS da 8889 (WHIP) não dá contexto seguro à página. O
# navegador decide `isSecureContext` pela origem que serviu o **documento**: uma
# página em `http://<ip>:8443` continua insegura mesmo que o JavaScript faça
# `fetch` para `https://<ip>:8889`, e sem contexto seguro o Chrome **nem expõe**
# `navigator.mediaDevices` (medido em 2026-10-27, ADR-0005 do arquo). Daí uma
# origem HTTPS separada, no mesmo certificado.
#
# **Por que este arquivo não mora em `deploy/certs/`:** aquela pasta é ignorada
# por inteiro (só o `.gitignore` dela é versionado). Configuração de servidor
# tem de estar no Git; material de chave, não. O certificado entra por bind
# mount em `/certs` (read-only), como no MediaMTX.
#
# **Por que sem imagem customizada:** `nginx:1.27-alpine` + este `conf.d` faz o
# serviço inteiro. Nada de build, nada de pip/npm — a regra do E0 é não
# adicionar dependência para servir dois arquivos estáticos.
server {
    # Bind na 8443 do container; o compose publica em `${LAN_IP}:8443` (nunca
    # em 0.0.0.0, DIV-003). O `ssl` é o que dá o contexto seguro.
    listen 8443 ssl;
    server_name vsl.local 192.168.59.102;

    # O MESMO certificado que o MediaMTX usa em 8889. Um `ca.crt` instalado no
    # celular vale para as duas portas — é o que evita onboarding duplicado.
    ssl_certificate     /certs/server.crt;
    ssl_certificate_key /certs/server.key;

    # TLS 1.2 é o piso: o Chrome do Android 10 do laboratório negocia 1.3, mas
    # aparelho antigo em campo pode parar em 1.2.
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:capture:1m;
    ssl_session_timeout 10m;

    # Documento e scripts saem dos arquivos versionados do dashboard
    # (`dashboard/frontend/`), montados read-only.
    root  /usr/share/nginx/html;
    charset utf-8;

    # Whitelist de locations (I4). `root` + `try_files` servia a pasta inteira:
    # `https://…:8443/index.html` respondia 200 com o dashboard, e ali o
    # `ws://…:8443/ws` e `/api/history` não existem (404) — o dashboard abria
    # quebrado em silêncio, e a origem 8443 não tem backend nenhum para servir.
    # Esta porta publica **só** a página de captura e o que ela carrega.
    location = /capture.html             { try_files $uri =404; }
    location = /capture.js               { try_files $uri =404; }
    location = /codec-gate.js            { try_files $uri =404; }
    location = /codec-gate-selftest.html { try_files $uri =404; }
    location = /style.css                { try_files $uri =404; }

    # Sem lista de diretório e sem servir `.git` ou arquivos ocultos.
    autoindex off;
    location ~ /\. { return 404; }

    # A página é o instrumento de medição: HTML/JS em cache fazem a rodada
    # seguinte rodar o código anterior (sintoma medido no M1 do arquo,
    # 2026-10-28). `no-store` no documento e nos scripts locais.
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    # Qualquer outra rota — `/`, `/index.html`, `/app.js`, `/certs/…` — é 404
    # explícito. Nada de `try_files` genérico aqui.
    location / {
        return 404;
    }
}
